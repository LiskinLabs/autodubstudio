[project]
name = "autodubstudio"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "deep-translator>=1.11.4",
    "edge-tts>=7.2.8",
    "fastapi>=0.115.0",
    "google-genai>=2.8.0",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=1.26,<2.0",
    "openai>=2.41.0",
    "openai-whisper>=20250625",
    "psutil>=7.0.0",
    "pydub>=0.25.1",
    "pyqt6>=6.11.0",
    "pyqt6-fluent-widgets>=1.11.2",
    "pysrt>=1.1.2",
    "soundcard>=0.4.6",
    "torch==2.5.1+cu121",
    "torchaudio==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "tqdm>=4.66.0",
    "transformers>=4.53.0",
    "demucs>=4.0.1",
    "f5-tts>=1.1.20",
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.5",
    "uvicorn>=0.34.0",
    "yt-dlp>=2026.6.9",
    "pyannote-audio==3.1.1",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
