# AutoDubStudio — Ruff Configuration
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top (qfluentwidgets after GPU force)
    "E701",   # multiple statements on one line (colon) — style preference
    "E702",   # semicolons — style preference
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
