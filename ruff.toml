# AutoDubStudio - Ruff Configuration
target-version = "py312"

[lint]
preview = true
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PLC0415", # import-outside-toplevel
    "F811",
]
ignore = [
    "E501",   # line too long
    "E402",   # module level import not at top
    "E701",   # multiple statements on one line
    "E702",   # semicolons
    "PLC0415", "B905", "F841", "I001", "F401", "B904", "B007", "E722", "E741"
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
