name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        working-directory: ./gui
        run: npm install

      # ==============================================================
      # NOTE: For eSigner to work on GitHub Actions, you must use the 
      # eSigner CodeSign action to mount the certificate into the runner
      # OR sign the binaries locally and upload them manually.
      # If you use SSL.com eSigner, uncomment and configure this block:
      # ==============================================================
      - name: Create dummy resource files
        run: |
          echo "{}" > config.json
          echo "" > github_token.txt

      - name: Setup eSigner CKA
        uses: anatawa12/setup-eSigner-CKA@v1
        with:
          mode: product
          username: ${{ secrets.ESIGNER_USERNAME }}
          password: ${{ secrets.ESIGNER_PASSWORD }}
          totp-secret: ${{ secrets.ESIGNER_TOTP_SECRET }}

      - name: Add signtool to PATH
        run: |
          $windowsKitsDir = "C:\Program Files (x86)\Windows Kits\10\bin"
          $signtoolPaths = Get-ChildItem -Path $windowsKitsDir -Filter "signtool.exe" -Recurse | Where-Object { $_.DirectoryName.EndsWith("\x86") }
          if ($signtoolPaths.Count -gt 0) {
              $signtoolDir = $signtoolPaths[0].DirectoryName
              Write-Host "Found signtool at $signtoolDir"
              echo "$signtoolDir" >> $env:GITHUB_PATH
          } else {
              Write-Error "signtool.exe not found"
          }

      - name: Inject certificateThumbprint into tauri.conf.json
        shell: powershell
        run: |
          # Wait a moment for eSigner CKA to be fully loaded
          Start-Sleep -Seconds 5
          
          # Find the certificate loaded by eSigner CKA
          $certs = Get-ChildItem -Path Cert:\CurrentUser\My
          Write-Host "Available certificates:"
          $certs | Format-Table -Property Subject, Thumbprint
          
          $cert = $certs | Where-Object { $_.Subject -match "Silvestr Liskin" }
          if (-not $cert) {
              $cert = $certs | Select-Object -First 1
          }
          
          if ($cert) {
              Write-Host "Using certificate: $($cert.Subject) with thumbprint: $($cert.Thumbprint)"
              $tauriPath = "gui/src-tauri/tauri.conf.json"
              $tauri = Get-Content $tauriPath | ConvertFrom-Json
              
              # Remove signCommand if it exists
              if ($tauri.bundle.windows.PSObject.Properties.Match('signCommand').Count -gt 0) {
                  $tauri.bundle.windows.PSObject.Properties.Remove('signCommand')
              }
              
              $tauri.bundle.windows | Add-Member -MemberType NoteProperty -Name "certificateThumbprint" -Value $cert.Thumbprint -Force
              $tauri.bundle.windows | Add-Member -MemberType NoteProperty -Name "timestampUrl" -Value "http://ts.ssl.com" -Force
              
              $tauri | ConvertTo-Json -Depth 10 | Set-Content $tauriPath
              Write-Host "Injected certificateThumbprint: $($tauri.bundle.windows.certificateThumbprint)"
          } else {
              Write-Error "No certificate found in CurrentUser\My!"
          }

      - name: Build and Sign Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: ./gui
          tagName: ${{ github.ref_name }}
          releaseName: 'AutoDub Studio ${{ github.ref_name }}'
          releaseBody: 'Automatic release'
          releaseDraft: false
          prerelease: false
