name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        working-directory: ./gui
        run: npm install

      # ==============================================================
      # NOTE: For eSigner to work on GitHub Actions, you must use the 
      # eSigner CodeSign action to mount the certificate into the runner
      # OR sign the binaries locally and upload them manually.
      # If you use SSL.com eSigner, uncomment and configure this block:
      # ==============================================================
      - name: Create dummy resource files
        run: |
          echo "{}" > config.json
          echo "" > github_token.txt

      - name: Setup eSigner CKA
        uses: anatawa12/setup-eSigner-CKA@v1
        with:
          mode: product
          username: ${{ secrets.ESIGNER_USERNAME }}
          password: ${{ secrets.ESIGNER_PASSWORD }}
          totp-secret: ${{ secrets.ESIGNER_TOTP_SECRET }}

      - name: Add signtool to PATH
        run: |
          $windowsKitsDir = "C:\Program Files (x86)\Windows Kits\10\bin"
          $signtoolPaths = Get-ChildItem -Path $windowsKitsDir -Filter "signtool.exe" -Recurse | Where-Object { $_.DirectoryName.EndsWith("\x86") }
          if ($signtoolPaths.Count -gt 0) {
              $signtoolDir = $signtoolPaths[0].DirectoryName
              Write-Host "Found signtool at $signtoolDir"
              echo "$signtoolDir" >> $env:GITHUB_PATH
          } else {
              Write-Error "signtool.exe not found"
          }

      - name: Remove certificateThumbprint and signCommand
        shell: powershell
        run: |
          $tauriPath = "gui/src-tauri/tauri.conf.json"
          $tauri = Get-Content $tauriPath | ConvertFrom-Json
          if ($tauri.bundle.windows.PSObject.Properties.Match('certificateThumbprint').Count -gt 0) {
              $tauri.bundle.windows.PSObject.Properties.Remove('certificateThumbprint')
          }
          if ($tauri.bundle.windows.PSObject.Properties.Match('signCommand').Count -gt 0) {
              $tauri.bundle.windows.PSObject.Properties.Remove('signCommand')
          }
          $tauri | ConvertTo-Json -Depth 10 | Set-Content $tauriPath

      - name: Build Tauri App (Unsigned)
        shell: powershell
        run: |
          cd gui
          npm run tauri build

      - name: Sign Executable with eSigner
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "gui/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          Write-Host "Signing $($exe.FullName)"
          .github\scripts\sign.ps1 $exe.FullName

      - name: Generate Updater Artifacts
        shell: powershell
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          $exe = Get-ChildItem -Path "gui/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          $exeName = $exe.Name
          Write-Host "Generating signature for $exeName"
          
          # We use tauri cli to sign it
          cd gui
          $sigOutput = npx tauri signer sign -k $env:TAURI_PRIVATE_KEY $exe.FullName
          
          # The output format is usually just the signature string
          # Or we can just read the generated .sig file if tauri creates it
          # Actually `tauri signer sign` prints the signature and creates a .sig file?
          # Let's just create latest.json directly
          # Wait! It might prompt for password if we don't set TAURI_SIGNING_PRIVATE_KEY_PASSWORD!
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:TAURI_KEY_PASSWORD
          $env:TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_PRIVATE_KEY
          
          $sigContent = npx tauri signer sign -k $env:TAURI_PRIVATE_KEY $exe.FullName
          Write-Host "Raw Signature Output: $sigContent"
          # Usually the last line is the signature, or it just prints the signature.
          $sigContent = $sigContent -split "`n" | Select-Object -Last 1 | Out-String
          $sigContent = $sigContent.Trim()
          
          cd ..
          $version = "${{ github.ref_name }}"
          $url = "https://github.com/LiskinLabs/autodubstudio/releases/download/$version/$exeName"
          
          $latestJson = @{
              version = $version
              notes = "Automatic release"
              pub_date = (Get-Date).ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = @{
                  "windows-x86_64" = @{
                      signature = $sigContent
                      url = $url
                  }
              }
          }
          $latestJson | ConvertTo-Json -Depth 10 | Set-Content "latest.json"
          Write-Host "Generated latest.json:"
          Get-Content "latest.json"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            gui/src-tauri/target/release/bundle/nsis/*.exe
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
