name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        working-directory: ./gui
        run: npm install

      # ==============================================================
      # NOTE: For eSigner to work on GitHub Actions, you must use the 
      # eSigner CodeSign action to mount the certificate into the runner
      # OR sign the binaries locally and upload them manually.
      # If you use SSL.com eSigner, uncomment and configure this block:
      # ==============================================================
      - name: Create dummy resource files
        run: |
          echo "{}" > config.json
          echo "" > github_token.txt

      - name: Setup eSigner CKA
        uses: anatawa12/setup-eSigner-CKA@v1
        with:
          mode: product
          username: ${{ secrets.ESIGNER_USERNAME }}
          password: ${{ secrets.ESIGNER_PASSWORD }}
          totp-secret: ${{ secrets.ESIGNER_TOTP_SECRET }}

      - name: Add signtool to PATH
        run: |
          $windowsKitsDir = "C:\Program Files (x86)\Windows Kits\10\bin"
          $signtoolPaths = Get-ChildItem -Path $windowsKitsDir -Filter "signtool.exe" -Recurse | Where-Object { $_.DirectoryName.EndsWith("\x86") }
          if ($signtoolPaths.Count -gt 0) {
              $signtoolDir = $signtoolPaths[0].DirectoryName
              Write-Host "Found signtool at $signtoolDir"
              echo "$signtoolDir" >> $env:GITHUB_PATH
          } else {
              Write-Error "signtool.exe not found"
          }

      - name: Build and inject custom signtool
        shell: powershell
        run: |
          $binDir = "$pwd\.github\scripts\bin"
          New-Item -ItemType Directory -Force -Path $binDir
          rustc .github\scripts\signtool_wrapper.rs -o $binDir\signtool.exe
          
          $tauriPath = "gui/src-tauri/tauri.conf.json"
          $tauri = Get-Content $tauriPath | ConvertFrom-Json
          $absPath = "$pwd/.github/scripts/bin/signtool.exe".Replace('\', '/')
          $tauri.bundle.windows.signCommand = "$absPath sign /debug /tr http://ts.ssl.com /td sha256 /fd sha256 /n `"Silvestr Liskin`" `"%1`""
          $tauri | ConvertTo-Json -Depth 10 | Set-Content $tauriPath
          Write-Host "Injected signCommand: $($tauri.bundle.windows.signCommand)"

      - name: Build and Sign Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: ./gui
          tagName: ${{ github.ref_name }}
          releaseName: 'AutoDub Studio ${{ github.ref_name }}'
          releaseBody: 'Automatic release'
          releaseDraft: false
          prerelease: false
