name: "CI — Lint + Build + Visual Tests"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Stage 1: Code Quality ──
  lint:
    name: "🔍 ESLint + Prettier"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npx eslint src/ --max-warnings 50
      - run: npx prettier --check "src/**/*.{ts,tsx,css}"

  # ── Stage 2: Build Check ──
  build:
    name: "🏗️ Vite Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm run build

  # ── Stage 3: Storybook Build ──
  storybook:
    name: "📚 Storybook Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npx storybook build --disable-telemetry

  # ── Stage 4: Visual Regression ──
  chromatic:
    name: "🎨 Chromatic Visual Tests"
    needs: [storybook]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gui
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: ./gui
          exitZeroOnChanges: true
          autoAcceptChanges: "main"
